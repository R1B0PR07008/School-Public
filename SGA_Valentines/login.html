<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  font-family: Montserrat, sans-serif;
  background:linear-gradient(135deg,#FFF0F5,#FFE4E9);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.card{
  background:white;
  padding:40px;
  border-radius:18px;
  box-shadow:0 10px 40px rgba(139,46,74,.15);
  width:100%;
  max-width:380px;
  text-align:center;
}
h1{
  color:#8B2E4A;
  margin-bottom:10px;
}
p{color:#666;margin-bottom:25px}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:2px solid #FFE4E9;
  font-size:16px;
}
input:focus{
  outline:none;
  border-color:#D4A5A5;
}
button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#8B2E4A,#D4A5A5);
  color:white;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
}
.error{
  color:#FF6B6B;
  margin-top:15px;
  display:none;
}

#password{
  box-sizing:border-box;
}
</style>
</head>

<body>

<div class="card">
  <h1>🔐 Admin Login</h1>
  <p>Enter the admin password</p>

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="off"
  />

  <button id="loginBtn">Log in</button>

  <div class="error" id="error">Incorrect password</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ===== FIREBASE ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDrLuZwJ_GZieK1vAA_KGQlY1DRe4Z2BRQ",
  authDomain: "sgasaintvalentines.firebaseapp.com",
  databaseURL: "https://sgasaintvalentines-default-rtdb.firebaseio.com",
  projectId: "sgasaintvalentines",
  storageBucket: "sgasaintvalentines.firebasestorage.app",
  messagingSenderId: "521888807329",
  appId: "1:521888807329:web:66dd6faca9c0e8c28273e0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ===== LOGIN ===== */
const input = document.getElementById("password");
const error = document.getElementById("error");
const btn = document.getElementById("loginBtn");

btn.onclick = async () => {
  error.style.display = "none";

  const snap = await get(ref(db, "PASSWORD"));
  const realPassword = snap.val();

  if (!realPassword) {
    error.textContent = "Password not configured";
    error.style.display = "block";
    return;
  }

  if (input.value === realPassword) {
    localStorage.setItem("ADMIN_AUTH", "true");
    window.location.href = "admin.html";
  } else {
    error.style.display = "block";
  }
};

/* Enter key support */
input.addEventListener("keydown", e => {
  if (e.key === "Enter") btn.click();
});
</script>

</body>
</html>
