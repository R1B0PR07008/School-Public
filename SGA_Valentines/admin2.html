<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Orders</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .order-card {
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .gift {
      margin-left: 15px;
      font-size: 14px;
    }

    .status {
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: white;
    }

    .paid {
      background: green;
    }

    .pending {
      background: orange;
    }
  </style>
</head>

<body>
  <h1>📦 Orders (Newest → Oldest)</h1>

  <div id="ordersContainer"></div>

  <script type="module">
    // ================= FIREBASE IMPORTS =================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ================= CONFIG =================
    const firebaseConfig = {
  apiKey: "AIzaSyDrLuZwJ_GZieK1vAA_KGQlY1DRe4Z2BRQ",
  authDomain: "sgasaintvalentines.firebaseapp.com",
  databaseURL: "https://sgasaintvalentines-default-rtdb.firebaseio.com",
  projectId: "sgasaintvalentines",
  storageBucket: "sgasaintvalentines.firebasestorage.app",
  messagingSenderId: "521888807329",
  appId: "1:521888807329:web:66dd6faca9c0e8c28273e0"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ================= LOAD ORDERS =================
    const ordersRef = ref(db, "orders");
    const container = document.getElementById("ordersContainer");

    onValue(ordersRef, (snapshot) => {
      const ordersData = snapshot.val() || {};

      // Convert object → array
      let ordersArray = Object.values(ordersData);

      // ✅ Sort newest → oldest
      ordersArray.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      // Clear container
      container.innerHTML = "";

      // Render orders
      ordersArray.forEach(order => {
        const date = order.createdAt
          ? new Date(order.createdAt).toLocaleString()
          : "Unknown";

        const statusClass = order.status === "paid" ? "paid" : "pending";

        const card = document.createElement("div");
        card.className = "order-card";

        card.innerHTML = `
          <div class="order-header">
            <span>Order: ${order.orderID}</span>
            <span class="status ${statusClass}">
              ${order.status || "pending"}
            </span>
          </div>

          <p><b>Buyer:</b> ${order.buyerName} (${order.buyerEmail})</p>
          <p><b>Total:</b> $${order.totalAmount}</p>
          <p><b>Created:</b> ${date}</p>

          <p><b>Gifts:</b></p>
          ${order.gifts.map(g => `
            <div class="gift">
              🎁 ${g.giftType} → ${g.recipientName} (${g.school}, Grade ${g.grade})
            </div>
          `).join("")}
        `;

        container.appendChild(card);
      });
    });
  </script>
</body>
</html>
